<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登録カードの印刷</title>
<style>/*
 * ORISAMO カードスキャン
 * Unity側(OrisamoUI.cs)の画面デザインに合わせた配色・装飾。
 * 夜空のような濃紫のパネル + 金の外枠と細い内枠 + 上下のひし形飾り、魔法陣のリング、
 * 背景にはバトル画面と同じ浮遊島のアリーナを敷く。
 */
:root {
  /* OrisamoUI の配色 */
  --ink: #09080f;            /* Ink        (0.035, 0.03, 0.07) */
  --night: #141126;          /* Night      (0.08, 0.065, 0.15) */
  --gold: #f7cf70;           /* Gold       (0.97, 0.81, 0.44) */
  --gold-light: #ffedb3;     /* GoldLight  (1, 0.93, 0.70) */
  --gold-deep: #9e6e29;      /* GoldDeep   (0.62, 0.43, 0.16) */
  --gold-soft: rgba(247, 207, 112, 0.38);
  --parchment: #fcf2db;      /* Parchment  (0.99, 0.95, 0.86) */
  --muted: #bdb3d4;          /* Muted      (0.74, 0.70, 0.83) */
  --arcane: #8c5cf2;         /* Arcane     (0.55, 0.36, 0.95) */
  --attack: #ff7347;         /* AttackColor */
  --defense: #5cadff;        /* DefenseColor */
  --level-strong: #ff614d;   /* LevelColor(Strong) */
  --level-normal: #ffd966;   /* LevelColor(Normal) */
  --level-weak: #73ccff;     /* LevelColor(Weak) */
  --player2: #619eff;
  --success: #5cf27a;
  --danger: #ff5245;

  /* 開封演出側で使っている旧変数名 */
  --brass: var(--gold);
  --brass-soft: var(--gold-soft);
  --mist-white: var(--parchment);
  --mist-dim: var(--muted);
  --mutation-violet: #b98cff;

  --font-logo: "Cinzel", "Shippori Antique B1", serif;
  --font-display: "Shippori Antique B1", "Zen Kaku Gothic New", serif;
  --font-body: "Zen Kaku Gothic New", sans-serif;

  --radius: 18px;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--ink);
}

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--ink);
  color: var(--parchment);
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- 背景: バトル画面と同じ浮遊島アリーナ + 夜の陰り ---------- */

.arena-backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    /* 上下を Ink に沈める(BattleHud の TopShade/BottomShade と同じ考え方) */
    linear-gradient(180deg, rgba(9, 8, 15, 0.55) 0%, rgba(9, 8, 15, 0.15) 28%, rgba(9, 8, 15, 0.6) 62%, rgba(9, 8, 15, 0.96) 100%),
    /* 周辺を暗くするビネット */
    radial-gradient(ellipse 90% 70% at 50% 35%, transparent 40%, rgba(9, 8, 15, 0.75) 100%),
    url("art/arena.jpg") center 30% / cover no-repeat;
}

/* 夕日の光が上から差し込む */
.stage-spotlight {
  position: fixed;
  top: -25vh;
  left: 50%;
  width: 150vw;
  height: 90vh;
  transform: translateX(-50%);
  background: radial-gradient(ellipse 45% 60% at 50% 0%, rgba(255, 220, 150, 0.22) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
  mix-blend-mode: screen;
  animation: spotlightBreathe 6s ease-in-out infinite;
}

@keyframes spotlightBreathe {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* 舞い上がる金と魔力の粒子 */
.stage-dust {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.stage-dust::before,
.stage-dust::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 0;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 237, 179, 0.7);
  box-shadow:
    8vw -12vh 6px 1px rgba(247, 207, 112, 0.55),
    22vw -48vh 4px 0 rgba(140, 92, 242, 0.6),
    37vw -20vh 6px 1px rgba(255, 237, 179, 0.5),
    51vw -70vh 4px 0 rgba(247, 207, 112, 0.45),
    64vw -34vh 6px 1px rgba(140, 92, 242, 0.55),
    79vw -58vh 4px 0 rgba(255, 237, 179, 0.5),
    92vw -16vh 6px 1px rgba(247, 207, 112, 0.5);
  animation: dustDrift 16s linear infinite;
}

.stage-dust::after {
  left: 4vw;
  animation-duration: 23s;
  animation-delay: -9s;
}

@keyframes dustDrift {
  0% { transform: translateY(0); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(-60vh); opacity: 0; }
}

.container {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 16px 16px 32px;
}

/* ---------- 共通: 装飾つきパネル(OrisamoUI.CreateOrnatePanel 相当) ---------- */

.home-section,
.battle-wait-section,
.name-input-section,
.photo-capture-section {
  position: relative;
  margin-top: 14px;
  padding: 26px 18px 24px;
  border-radius: var(--radius);
  /* 塗り: 上から下へわずかに暗くなる陰影 */
  background: linear-gradient(180deg, rgba(24, 19, 44, 0.92) 0%, rgba(14, 11, 27, 0.94) 100%);
  border: 2px solid var(--gold);
  box-shadow:
    inset 0 0 0 6px rgba(14, 11, 27, 0.9),
    inset 0 0 0 7px var(--gold-soft),
    inset 0 0 40px rgba(140, 92, 242, 0.12),
    0 18px 50px rgba(0, 0, 0, 0.6);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

/* 上下中央のひし形の宝石 */
.home-section::before,
.home-section::after,
.battle-wait-section::before,
.battle-wait-section::after,
.name-input-section::before,
.name-input-section::after,
.photo-capture-section::before,
.photo-capture-section::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 14px;
  height: 14px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold) 50%, var(--gold-deep));
  box-shadow: 0 0 10px rgba(247, 207, 112, 0.6);
  transform: translate(-50%, -50%) rotate(45deg);
}

.home-section::before,
.battle-wait-section::before,
.name-input-section::before,
.photo-capture-section::before {
  top: -1px;
}

.home-section::after,
.battle-wait-section::after,
.name-input-section::after,
.photo-capture-section::after {
  top: calc(100% + 1px);
}

/* 金の飾り罫(OrisamoUI.CreateDivider 相当): 見出しラベルの下に付ける */
.home-lead::after,
.scanned-card-label::after {
  content: "";
  display: block;
  width: 180px;
  height: 10px;
  margin: 10px auto 0;
  background:
    linear-gradient(45deg, transparent 30%, var(--gold) 30% 70%, transparent 70%) center / 9px 9px no-repeat,
    linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 44%, transparent 44% 56%, var(--gold) 56%, var(--gold) 70%, transparent) center / 100% 2px no-repeat;
  opacity: 0.85;
}

.name-input-buttons button,
#next-scan-btn,
.battle-wait-section .secondary,
.back-to-home-btn {
  font-family: var(--font-display);
  letter-spacing: 0.08em;
  transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
}

.name-input-buttons button:active,
#next-scan-btn:active,
.battle-wait-section .secondary:active,
.back-to-home-btn:active,
.home-btn:active,
.battle-turn-buttons button:active {
  transform: scale(0.97);
}

/* ---------- タイトル(ロゴ) ---------- */

.brand {
  text-align: center;
  padding: 10px 0 4px;
}

/* 魔法陣の紋章(OrisamoUI.CreateElementEmblem 相当) */
.brand-mark {
  position: relative;
  width: 64px;
  height: 64px;
  margin: 8px auto 10px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #2a1d52 0%, var(--ink) 75%);
  border: 4px solid rgba(140, 92, 242, 0.85);
  animation: crestGlow 3.5s ease-in-out infinite;
}

.brand-mark::before {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  border: 1px dashed var(--gold-soft);
  animation: ringSpin 30s linear infinite;
}

.brand-mark span {
  font-family: var(--font-display);
  font-size: 1.7rem;
  color: #fff;
  text-shadow: 0 0 10px rgba(140, 92, 242, 0.9), 0 2px 0 #1b0f3a;
}

@keyframes crestGlow {
  0%, 100% { box-shadow: 0 0 0 3px var(--ink), 0 0 0 4px var(--gold), 0 0 18px rgba(140, 92, 242, 0.45); }
  50% { box-shadow: 0 0 0 3px var(--ink), 0 0 0 4px var(--gold), 0 0 34px rgba(140, 92, 242, 0.85); }
}

@keyframes ringSpin {
  to { transform: rotate(360deg); }
}

h1 {
  margin: 0 0 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

/* 金の縦グラデーション文字(OrisamoUI.ApplyGoldGradient + ApplyOutline 相当) */
.brand-logo {
  font-family: var(--font-logo);
  font-weight: 900;
  font-size: 2.3rem;
  letter-spacing: 0.12em;
  padding-left: 0.12em;
  line-height: 1.1;
  background: linear-gradient(180deg, var(--gold-light) 15%, var(--gold) 50%, var(--gold-deep) 95%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 1px rgba(46, 20, 5, 0.9);
  filter: drop-shadow(0 3px 0 rgba(30, 12, 3, 0.9)) drop-shadow(0 0 14px rgba(247, 207, 112, 0.35));
}

.brand-sub {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 0.85rem;
  letter-spacing: 0.5em;
  padding-left: 0.5em;
  color: var(--parchment);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

#reader {
  margin-top: 14px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 2px solid var(--gold) !important;
  background: var(--ink);
  box-shadow: 0 0 0 4px rgba(9, 8, 15, 0.8), 0 0 0 5px var(--gold-soft), 0 0 30px rgba(140, 92, 242, 0.35), 0 18px 40px rgba(0, 0, 0, 0.6);
}

/* html5-qrcode が生成するボタン・選択欄も世界観に合わせる */
#reader button,
#reader select {
  margin: 6px 4px;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, #2a2050, #17112e);
  color: var(--gold-light);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 0.85rem;
}

#reader a,
#reader span,
#reader div {
  color: var(--muted);
}

#reader img[alt="Info icon"],
#reader img[alt="Camera based scan"] {
  filter: invert(1) opacity(0.7);
}

/* ---------- ホーム画面(モード選択) ---------- */

.home-section {
  text-align: center;
}

.home-lead {
  margin: 0 0 18px;
  font-family: var(--font-display);
  font-size: 0.95rem;
  color: var(--parchment);
  letter-spacing: 0.12em;
}

.home-buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.home-btn {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
  padding: 18px 16px;
  border-radius: 14px;
  border: 2px solid var(--gold);
  color: #fff;
  font-family: var(--font-display);
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.12s ease, box-shadow 0.2s ease;
}

/* 斜めに走る光 */
.home-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -60%;
  width: 40%;
  height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
  transform: skewX(-18deg);
  animation: btnSheen 4.5s ease-in-out infinite;
  pointer-events: none;
}

.home-btn-battle::after {
  animation-delay: 2.2s;
}

@keyframes btnSheen {
  0%, 70% { left: -60%; }
  100% { left: 130%; }
}

/* 漢字の紋章 */
.home-btn-icon {
  flex: none;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: #fff;
  background: radial-gradient(circle, rgba(9, 8, 15, 0.55), rgba(9, 8, 15, 0.85));
  border: 3px solid var(--emblem);
  box-shadow: 0 0 0 2px rgba(9, 8, 15, 0.6), 0 0 0 3px var(--gold), 0 0 16px var(--emblem);
  text-shadow: 0 0 10px var(--emblem);
}

.home-btn-label {
  font-weight: 400;
  font-size: 1.25rem;
  letter-spacing: 0.14em;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55), 0 0 12px rgba(0, 0, 0, 0.4);
}

.home-btn-create {
  --emblem: #b98cff;
  background: linear-gradient(180deg, #4a2f8f 0%, #2a1a5a 55%, #1a1036 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 24px rgba(140, 92, 242, 0.45), 0 10px 26px rgba(0, 0, 0, 0.5);
}

.home-btn-battle {
  --emblem: var(--attack);
  background: linear-gradient(180deg, #a3381f 0%, #6b1d14 55%, #3a0f0c 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 24px rgba(255, 115, 71, 0.4), 0 10px 26px rgba(0, 0, 0, 0.5);
}

/* 開発者モード(?dev=1)。本番の見た目と区別できるよう、点線の枠で囲む */
.dev-panel {
  margin-top: 22px;
  padding: 16px 14px;
  border: 1px dashed rgba(140, 92, 242, 0.7);
  border-radius: 12px;
  background: rgba(140, 92, 242, 0.08);
  text-align: left;
}

.dev-panel-title {
  margin: 0 0 12px;
  font-weight: 700;
  color: var(--mutation-violet);
  letter-spacing: 0.04em;
}

.dev-panel-title span {
  display: block;
  margin-top: 2px;
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--muted);
}

.dev-label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.75rem;
  color: var(--muted);
}

.dev-input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(0, 0, 0, 0.4);
  color: var(--parchment);
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.9rem;
}

.dev-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

.dev-btn {
  padding: 11px 8px;
  border-radius: 9px;
  border: 1px solid rgba(140, 92, 242, 0.55);
  background: rgba(0, 0, 0, 0.35);
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
}

.dev-btn:active {
  transform: scale(0.98);
}

.dev-btn-wide {
  grid-column: 1 / -1;
  width: 100%;
}

.dev-btn-cpu {
  background: linear-gradient(135deg, rgba(140, 92, 242, 0.4), rgba(60, 36, 120, 0.4));
}

.battle-wait-section .dev-btn {
  margin-bottom: 10px;
}

.back-to-home-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 11px;
  border-radius: 999px;
  border: 1px solid var(--gold-soft);
  background: rgba(9, 8, 15, 0.6);
  color: var(--gold-light);
  font-size: 0.9rem;
  cursor: pointer;
}

/* ---------- 対戦キュー待機 ---------- */

.battle-wait-section {
  text-align: center;
}

/* キャラクター写真は魔法陣の円の中に(BattleHud の LevelToken と同じ意匠) */
.battle-wait-photo {
  width: 56%;
  max-width: 220px;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 50%;
  border: 5px solid rgba(140, 92, 242, 0.9);
  box-shadow:
    0 0 0 4px var(--ink),
    0 0 0 5px var(--gold),
    0 0 40px rgba(140, 92, 242, 0.6);
  margin: 6px auto 18px;
  display: block;
  background: var(--ink);
}

.battle-wait-name {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.6rem;
  margin: 0 0 10px;
  color: #fff;
  letter-spacing: 0.06em;
  text-shadow: 0 2px 0 var(--ink), 0 0 16px rgba(247, 207, 112, 0.45);
}

.battle-wait-status {
  font-size: 0.9rem;
  color: var(--parchment);
  margin: 0 0 18px;
  line-height: 1.6;
}

/* 待機中・相手の入力待ちは文字が呼吸する */
#battle-wait-status,
#battle-turn-prompt {
  animation: statusBreathe 2.4s ease-in-out infinite;
}

@keyframes statusBreathe {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

#battle-turn-prompt {
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.06em;
  color: var(--gold-light);
}

.battle-wait-section .secondary {
  width: 100%;
  padding: 12px;
  border-radius: 999px;
  background: rgba(9, 8, 15, 0.5);
  color: var(--gold-light);
  border: 1px solid var(--gold-soft);
  font-size: 0.9rem;
  cursor: pointer;
}

/* ---------- 対戦中の強/普/弱 選択(BattleHud の LevelToken と同じ円形の紋章) ---------- */

.battle-turn-buttons {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin: 8px 0 24px;
}

.battle-turn-buttons button {
  --level: var(--level-normal);
  flex: 0 1 92px;
  aspect-ratio: 1 / 1;
  padding: 0;
  border-radius: 50%;
  border: 6px solid var(--level);
  background: radial-gradient(circle, #1d1438 0%, #0d0a1a 75%);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 2.4rem;
  line-height: 1;
  cursor: pointer;
  text-shadow: 0 0 12px var(--level), 0 3px 0 rgba(0, 0, 0, 0.7);
  box-shadow:
    0 0 0 3px var(--ink),
    0 0 0 4px var(--gold),
    0 0 26px var(--level);
  transition: transform 0.12s ease, box-shadow 0.2s ease;
}

.battle-turn-buttons .battle-turn-strong { --level: var(--level-strong); }
.battle-turn-buttons .battle-turn-normal { --level: var(--level-normal); }
.battle-turn-buttons .battle-turn-weak { --level: var(--level-weak); }

.battle-turn-buttons button:disabled {
  filter: grayscale(0.7) brightness(0.6);
}

.battle-turn-result {
  font-family: var(--font-display);
  font-size: 2rem;
  letter-spacing: 0.1em;
  margin: 10px 0 20px;
  text-shadow: 0 3px 0 var(--ink), 0 0 20px currentColor;
}

.battle-turn-result.win {
  color: var(--gold);
}

.battle-turn-result.lose {
  color: var(--player2);
}

/* 対戦後に出す、このカードの通算成績 */
.battle-turn-record {
  font-family: var(--font-display);
  font-size: 1rem;
  letter-spacing: 0.06em;
  color: var(--parchment);
  margin: -8px 0 18px;
}

/* 勝った時だけ出す「勝利カードを保存する」(金のプライマリボタン) */
.battle-win-card-btn {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 45%, var(--gold-deep) 100%);
  color: #2a1606;
  border: 1px solid #ffe9a8;
  box-shadow: inset 0 -3px 0 rgba(90, 50, 10, 0.35), 0 0 0 3px rgba(9, 8, 15, 0.7), 0 0 22px rgba(247, 207, 112, 0.4);
  transition: transform 0.12s ease;
}

.battle-win-card-btn:active {
  transform: scale(0.97);
}

.battle-win-card-btn:disabled {
  filter: grayscale(0.6) brightness(0.7);
}

/* ---------- 名前入力 ---------- */

.scanned-card-label {
  font-size: 0.8rem;
  color: var(--muted);
  letter-spacing: 0.08em;
  margin: 0 0 16px;
  text-align: center;
}

.scanned-card-label span {
  color: var(--gold-light);
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
}

.name-input-section label {
  display: block;
  font-family: var(--font-display);
  font-size: 1.1rem;
  margin-bottom: 10px;
  text-align: center;
  color: var(--gold);
  letter-spacing: 0.1em;
}

.name-input-section input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid var(--gold-soft);
  background: rgba(9, 8, 15, 0.7);
  color: #fff;
  margin-bottom: 18px;
  font-size: 1.2rem;
  font-family: var(--font-display);
  text-align: center;
  letter-spacing: 0.06em;
}

.name-input-section input::placeholder {
  color: rgba(189, 179, 212, 0.6);
}

.name-input-section input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(247, 207, 112, 0.18), 0 0 20px rgba(140, 92, 242, 0.35);
}

.name-input-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.name-input-buttons button {
  width: 100%;
  padding: 15px;
  border-radius: 999px;
  border: none;
  font-weight: 400;
  font-size: 1.05rem;
  cursor: pointer;
}

/* 金のプライマリボタン */
#register-btn,
#capture-photo-btn,
#use-photo-btn,
#next-scan-btn {
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 45%, var(--gold-deep) 100%);
  color: #2a1606;
  border: 1px solid #ffe9a8;
  box-shadow: inset 0 -3px 0 rgba(90, 50, 10, 0.35), 0 0 0 3px rgba(9, 8, 15, 0.7), 0 0 22px rgba(247, 207, 112, 0.4);
  text-shadow: 0 1px 0 rgba(255, 245, 210, 0.6);
}

#register-btn:disabled {
  background: #3a3350;
  color: var(--muted);
  border-color: transparent;
  box-shadow: none;
  text-shadow: none;
}

.name-input-buttons button.secondary {
  background: rgba(9, 8, 15, 0.5);
  color: var(--gold-light);
  border: 1px solid var(--gold-soft);
}

/* ---------- 実物撮影・背景切り抜き ---------- */

.photo-instruction {
  font-size: 0.82rem;
  color: var(--parchment);
  line-height: 1.6;
  margin: 0 0 14px;
  text-align: center;
}

.photo-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  border: 2px solid var(--gold);
  box-shadow: 0 0 0 4px rgba(9, 8, 15, 0.8), 0 0 24px rgba(140, 92, 242, 0.35);
  margin-bottom: 18px;
}

/* 撮影ガイドの四隅の金具 */
.photo-frame::after {
  content: "";
  position: absolute;
  inset: 12px;
  z-index: 2;
  pointer-events: none;
  --c: var(--gold);
  background:
    linear-gradient(var(--c), var(--c)) top left / 26px 3px,
    linear-gradient(var(--c), var(--c)) top left / 3px 26px,
    linear-gradient(var(--c), var(--c)) top right / 26px 3px,
    linear-gradient(var(--c), var(--c)) top right / 3px 26px,
    linear-gradient(var(--c), var(--c)) bottom left / 26px 3px,
    linear-gradient(var(--c), var(--c)) bottom left / 3px 26px,
    linear-gradient(var(--c), var(--c)) bottom right / 26px 3px,
    linear-gradient(var(--c), var(--c)) bottom right / 3px 26px;
  background-repeat: no-repeat;
  filter: drop-shadow(0 0 4px rgba(247, 207, 112, 0.7));
}

/* 切り抜く被写体の目印(タップした位置に移動する小さな魔法陣) */
.photo-target {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 46px;
  height: 46px;
  margin: -23px 0 0 -23px;
  z-index: 3;
  pointer-events: none;
  border-radius: 50%;
  border: 3px solid var(--gold);
  box-shadow: 0 0 0 2px rgba(9, 8, 15, 0.7), 0 0 14px rgba(247, 207, 112, 0.8), inset 0 0 10px rgba(140, 92, 242, 0.7);
  transition: left 0.15s ease, top 0.15s ease;
  animation: targetPulse 1.6s ease-in-out infinite;
}

.photo-target::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--gold-light);
}

@keyframes targetPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

#photo-video {
  cursor: crosshair;
}

.photo-frame video,
.photo-frame canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 切り抜きプレビューは透過を確認しやすいよう市松模様の背景にする */
.photo-frame canvas#cutout-preview-canvas {
  object-fit: contain;
  background-color: #141126;
  background-image: linear-gradient(45deg, #221c3c 25%, transparent 25%),
    linear-gradient(-45deg, #221c3c 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #221c3c 75%),
    linear-gradient(-45deg, transparent 75%, #221c3c 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
}

/* ---------- 開封ステージ（サイン要素） ---------- */

.status-display-section {
  margin-top: 14px;
  text-align: center;
}

.reveal-stage {
  position: relative;
  perspective: 1400px;
  padding: 18px 0 6px;
}

.reveal-flash {
  position: absolute;
  inset: -15% -10%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 246, 224, 0.95) 0%, rgba(247, 207, 112, 0.45) 35%, transparent 70%);
  opacity: 0;
  pointer-events: none;
  z-index: 4;
}

.reveal-flash.fire {
  animation: flashBurst 550ms ease-out forwards;
}

.reveal-card.mutation ~ .reveal-flash.fire {
  background: radial-gradient(circle, rgba(240, 220, 255, 0.95) 0%, rgba(182, 124, 255, 0.5) 35%, transparent 70%);
}

@keyframes flashBurst {
  0% { opacity: 0; transform: scale(0.5); }
  25% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.4); }
}

.shockwave-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 40px;
  height: 40px;
  margin: -20px 0 0 -20px;
  border-radius: 50%;
  border: 2px solid var(--brass);
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}

.shockwave-ring.pulse {
  animation: shockwaveExpand 700ms cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
}

.reveal-card.mutation ~ .shockwave-ring.pulse {
  border-color: var(--mutation-violet);
}

@keyframes shockwaveExpand {
  0% { opacity: 0.9; transform: scale(0.3); }
  100% { opacity: 0; transform: scale(9); }
}

.flash-bulbs {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.flash-bulb {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  opacity: 0;
  filter: blur(1px);
  animation: bulbFlash 260ms ease-out forwards;
}

@keyframes bulbFlash {
  0% { opacity: 0; transform: scale(0.5); }
  30% { opacity: 1; transform: scale(1.3); }
  100% { opacity: 0; transform: scale(0.8); }
}

.reveal-card {
  width: min(80vw, 320px);
  aspect-ratio: 826 / 1151;
  margin: 0 auto;
  opacity: 0;
  transform: translateY(-160px) rotate(-12deg) scale(0.6);
  position: relative;
  z-index: 2;
  container-type: inline-size;
}

.reveal-card.show {
  animation: cardDrop 800ms cubic-bezier(0.32, 0.68, 0.3, 1.28) forwards;
}

@keyframes cardDrop {
  0% { opacity: 0; transform: translateY(-160px) rotate(-12deg) scale(0.6); }
  55% { opacity: 1; transform: translateY(8px) rotate(3deg) scale(1.04); }
  75% { transform: translateY(-6px) rotate(-1.5deg) scale(0.99); }
  100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
}

.reveal-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.reveal-card.flipped .reveal-card-inner {
  transform: rotateY(180deg);
}

.reveal-card.flipped.impact .reveal-card-inner {
  animation: cardImpact 420ms ease-out;
}

@keyframes cardImpact {
  0% { transform: rotateY(180deg) scale(1); }
  40% { transform: rotateY(180deg) scale(1.055); }
  100% { transform: rotateY(180deg) scale(1); }
}

.reveal-card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;
  overflow: hidden;
}

.reveal-card-back {
  background:
    radial-gradient(circle at 50% 45%, rgba(140, 92, 242, 0.35) 0%, transparent 55%),
    linear-gradient(160deg, #241a48, #0d0a1a);
  border: 2px solid var(--gold);
  box-shadow: inset 0 0 0 7px #0d0a1a, inset 0 0 0 8px var(--gold-soft), 0 20px 50px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

/* カード裏面の魔法陣 */
.crest-glyph {
  position: relative;
  width: 46%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 5px solid rgba(140, 92, 242, 0.9);
  box-shadow: 0 0 0 4px #0d0a1a, 0 0 0 5px var(--gold), 0 0 30px rgba(140, 92, 242, 0.7);
  animation: crestPulse 2.4s ease-in-out infinite;
}

.crest-glyph::before {
  content: "";
  position: absolute;
  inset: -22%;
  border-radius: 50%;
  border: 1px dashed var(--gold-soft);
  animation: ringSpin 18s linear infinite;
}

.crest-glyph span {
  font-family: var(--font-display);
  font-size: 2.6rem;
  color: #fff;
  text-shadow: 0 0 14px rgba(140, 92, 242, 1), 0 3px 0 #1b0f3a;
}

@keyframes crestPulse {
  0%, 100% { transform: scale(1); opacity: 0.75; }
  50% { transform: scale(1.08); opacity: 1; }
}

.crest-caption {
  margin: 18px 0 0;
  font-family: var(--font-logo);
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.32em;
  color: var(--gold);
}

.reveal-card-front {
  transform: rotateY(180deg);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
}

.card-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ホログラム風の光の帯。カードがめくれた直後に一度だけ斜めに走り抜ける */
.reveal-card-front::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -60%;
  width: 35%;
  height: 200%;
  background: linear-gradient(
    100deg,
    transparent 0%,
    rgba(255, 255, 255, 0.02) 35%,
    rgba(255, 255, 255, 0.6) 50%,
    rgba(255, 255, 255, 0.02) 65%,
    transparent 100%
  );
  transform: rotate(12deg);
  opacity: 0;
  pointer-events: none;
  z-index: 6;
}

.reveal-card.shine .reveal-card-front::before {
  animation: shineSweep 1.05s ease-out 100ms 1;
}

@keyframes shineSweep {
  0% { left: -60%; opacity: 0; }
  15% { opacity: 1; }
  55% { opacity: 1; }
  100% { left: 130%; opacity: 0; }
}

.reveal-card.mutation .reveal-card-front {
  box-shadow: 0 0 40px 4px rgba(182, 124, 255, 0.55), 0 20px 50px rgba(0, 0, 0, 0.6);
  animation: mutationPulse 2s ease-in-out infinite;
}

@keyframes mutationPulse {
  0%, 100% { box-shadow: 0 0 30px 2px rgba(182, 124, 255, 0.4), 0 20px 50px rgba(0, 0, 0, 0.6); }
  50% { box-shadow: 0 0 50px 8px rgba(182, 124, 255, 0.7), 0 20px 50px rgba(0, 0, 0, 0.6); }
}

/* ---------- カード画像の上に焼き付ける文字類（座標は元画像の実寸から算出） ---------- */

/* 撮影した写真を、カード画像の白枠(キャラクター画像スペース)いっぱいに敷き詰める。
   ※座標(%)はカード画像の実寸(白枠の内側)から算出。 */
.card-character-cutout {
  position: absolute;
  top: 15.3%;
  left: 7.4%;
  width: 85.1%;
  height: 55.1%;
  /* 切り抜いたキャラクター全体が枠に収まるようにする(coverだと頭や足が切れる) */
  object-fit: contain;
  object-position: 40% 100%;
  opacity: 0;
  z-index: 5;
}

/* カード画像の一部(ステータス欄・属性マーク)を写真の上に重ねて、写真がはみ出して見えないようにする。
   座標(%)はカード画像の実寸(826×1151)から算出。 */
.card-art-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 6;
  pointer-events: none;
}

.card-art-stats {
  clip-path: polygon(65.4% 50%, 93.8% 50%, 93.8% 71.2%, 65.4% 71.2%, 60% 67.5%, 65.4% 64.1%, 60% 60.7%, 65.4% 57.3%, 60% 53.8%);
}

.card-art-emblem {
  clip-path: circle(11.2cqw at 82.7% 14.4%);
}

.reveal-card.reveal-pop .card-character-cutout {
  animation: cutoutPop 460ms ease-out 200ms forwards;
}

@keyframes cutoutPop {
  0% { opacity: 0; transform: scale(0.94); }
  70% { opacity: 1; transform: scale(1.015); }
  100% { opacity: 1; transform: scale(1); }
}

.mutation-badge {
  position: absolute;
  top: 15.5%;
  left: 50%;
  transform: translateX(-50%) scale(0);
  color: var(--mutation-violet);
  font-weight: 700;
  font-size: clamp(0.6rem, 2.6vw, 0.75rem);
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px rgba(182, 124, 255, 0.8);
  z-index: 7;
}

.reveal-card.mutation .mutation-badge {
  animation: badgePop 500ms cubic-bezier(0.3, 1.6, 0.4, 1) forwards;
}

@keyframes badgePop {
  0% { transform: translateX(-50%) scale(0) rotate(-8deg); }
  70% { transform: translateX(-50%) scale(1.15) rotate(3deg); }
  100% { transform: translateX(-50%) scale(1) rotate(0); }
}

.overlay-defense {
  position: absolute;
  top: 17%;
  left: 9.5%;
  font-size: 4.2cqw;
  line-height: 1;
  color: #fff;
  background: linear-gradient(180deg, #4b7fd1, #23467f);
  border: 0.5cqw solid #0d2240;
  border-radius: 999px;
  padding: 1cqw 2.6cqw 1.1cqw 2.2cqw;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0.3cqw 0 rgba(0, 0, 0, 0.45);
  box-shadow: 0 0.6cqw 1.6cqw rgba(0, 0, 0, 0.35);
  opacity: 0;
  z-index: 7;
}

.reveal-card.reveal-pop .overlay-defense {
  animation: overlayPop 420ms ease-out 60ms forwards;
}

.result-character-name {
  position: absolute;
  top: 10.8%;
  left: 41.3%;
  width: 62%;
  margin: 0;
  transform: translate(-50%, -50%);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(0.85rem, 5.2cqw, 1.4rem);
  color: #1c1712;
  text-align: center;
  line-height: 1.15;
  opacity: 0;
  z-index: 7;
}

.reveal-card.reveal-pop .result-character-name {
  animation: nameOverlayPop 460ms ease-out 140ms forwards;
}

/* overlayPopと同じ動きだが、名前欄はbaseのtransformでtranslate(-50%,-50%)による
   中央寄せを行っているため、アニメーション側のキーフレームにもtranslateを含めて
   forwards適用後にtranslateが失われない(=右下にずれない)ようにする。 */
@keyframes nameOverlayPop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* ステータスの数値。カード画像の白い欄(x 597〜768、各行の中心 y 619 / 699 / 776)の中央に置く。
   白地の上で読みやすいよう、アイコンと同じ系統の濃い色にする */
.overlay-value {
  position: absolute;
  left: 72.3%;
  width: 20.7%;
  height: 6.3%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  font-weight: 900;
  font-size: 8.4cqw;
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  z-index: 7;
}

.overlay-hp {
  top: 50.6%;
  color: #1f7a12;
}

.overlay-atk {
  top: 57.6%;
  color: #b30000;
}

.overlay-spd {
  top: 64.3%;
  color: #0b62a3;
}

.reveal-card.reveal-pop .overlay-value {
  animation: overlayPop 380ms ease-out forwards;
}

.reveal-card.reveal-pop .overlay-hp { animation-delay: 260ms; }
.reveal-card.reveal-pop .overlay-atk { animation-delay: 360ms; }
.reveal-card.reveal-pop .overlay-spd { animation-delay: 460ms; }

@keyframes overlayPop {
  0% { opacity: 0; transform: scale(0.4); }
  70% { opacity: 1; transform: scale(1.15); }
  100% { opacity: 1; transform: scale(1); }
}

.overlay-skill {
  position: absolute;
  top: 76%;
  left: 9%;
  width: 55%;
  bottom: 5%;
  text-align: left;
  overflow: hidden;
  opacity: 0;
  z-index: 7;
}

.reveal-card.reveal-pop .overlay-skill {
  animation: overlayFadeUp 460ms ease-out 560ms forwards;
}

@keyframes overlayFadeUp {
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0); }
}

.skill-name {
  margin: 0 0 1.2cqw;
  font-weight: 900;
  color: #0d1b2a;
  font-size: 4.8cqw;
  line-height: 1.15;
}

.skill-description {
  margin: 0;
  font-size: 3.4cqw;
  font-weight: 700;
  color: #26313d;
  line-height: 1.45;
}

/* スパークル演出。カードめくり時に短く弾ける */
.sparkle-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 8;
}

.sparkle {
  position: absolute;
  font-size: 1rem;
  color: var(--brass);
  opacity: 0;
  animation: sparklePop 900ms ease-out forwards;
}

.reveal-card.mutation ~ .sparkle-layer .sparkle {
  color: var(--mutation-violet);
}

@keyframes sparklePop {
  0% { opacity: 0; transform: scale(0.3) translateY(0); }
  35% { opacity: 1; transform: scale(1.1) translateY(-6px); }
  100% { opacity: 0; transform: scale(0.6) translateY(-22px); }
}

#next-scan-btn {
  margin-top: 18px;
}

/* 突然変異時は背景ごと脈打たせて特別感を出す */
.mutation-vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  background: radial-gradient(circle at 50% 45%, transparent 30%, rgba(182, 124, 255, 0.22) 100%);
}

.mutation-vignette.active {
  animation: vignettePulse 2s ease-in-out infinite;
}

@keyframes vignettePulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.9; }
}

/* ---------- 登録済みカードの警告(画面いっぱいに大きく表示) ---------- */

.registered-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background:
    radial-gradient(circle at 50% 45%, rgba(255, 82, 69, 0.28) 0%, transparent 60%),
    rgba(9, 8, 15, 0.86);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

.registered-overlay.show {
  display: flex;
  animation: registeredFade 0.2s ease-out;
}

@keyframes registeredFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.registered-panel {
  position: relative;
  width: min(100%, 420px);
  padding: 64px 22px 26px;
  border-radius: var(--radius);
  text-align: center;
  background: linear-gradient(180deg, #3a1016 0%, #1c0a12 60%, #120812 100%);
  border: 3px solid var(--danger);
  box-shadow:
    inset 0 0 0 7px #1c0a12,
    inset 0 0 0 8px rgba(255, 82, 69, 0.45),
    0 0 60px rgba(255, 82, 69, 0.55),
    0 24px 60px rgba(0, 0, 0, 0.7);
}

.registered-overlay.show .registered-panel {
  animation: registeredSlam 0.5s cubic-bezier(0.3, 1.6, 0.4, 1), registeredShake 0.4s ease-in-out 0.45s;
}

@keyframes registeredSlam {
  0% { transform: scale(1.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes registeredShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}

/* 上辺に押された「済」の判 */
.registered-seal {
  position: absolute;
  top: 0;
  left: 50%;
  width: 96px;
  height: 96px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #ff6a5c 0%, #c4231b 70%);
  border: 5px solid #fff1ee;
  box-shadow: 0 0 0 4px var(--ink), 0 0 0 5px var(--gold), 0 0 36px rgba(255, 82, 69, 0.9);
}

.registered-seal span {
  font-family: var(--font-display);
  font-size: 3.2rem;
  line-height: 1;
  color: #fff;
  text-shadow: 0 3px 0 #6b0d08;
}

.registered-title {
  margin: 0 0 18px;
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 11vw, 3rem);
  line-height: 1.15;

      hint.textContent = "カード画像を読み込めませんでした。戻ってからもう一度お試しください。";
      print.textContent = "画像の読み込みに失敗";
    }
  }
  return { setCard, open };
})();
</script>
