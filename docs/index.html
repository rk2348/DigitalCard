<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>オリサモ カードスキャン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="mutation-vignette" id="mutation-vignette"></div>
  <div class="stage-spotlight"></div>
  <div class="stage-dust" id="stage-dust"></div>

  <div class="container">
    <div class="brand-mark">⬡</div>
    <h1>オリサモ カードスキャン</h1>

    <div id="home-section" class="home-section">
      <p class="home-lead">やりたいことを選んでください</p>
      <div class="home-buttons">
        <button id="create-character-btn" class="home-btn home-btn-create">
          <span class="home-btn-icon">🎴</span>
          <span class="home-btn-label">カードを登録</span>
        </button>
        <button id="start-battle-btn" class="home-btn home-btn-battle">
          <span class="home-btn-icon">⚔️</span>
          <span class="home-btn-label">対戦する</span>
        </button>
      </div>
    </div>

    <div id="reader" style="display: none;"></div>
    <button id="back-to-home-btn" class="back-to-home-btn" style="display: none;">← ホームに戻る</button>

    <div id="name-input-section" class="name-input-section" style="display: none;">
      <p class="scanned-card-label">カードID <span id="scanned-card-id"></span></p>
      <label for="character-name">キャラクターの名前</label>
      <input type="text" id="character-name" placeholder="なまえを入力" maxlength="20" />
      <div class="name-input-buttons">
        <button id="register-btn">登録する</button>
        <button id="rescan-btn" class="secondary">もう一度スキャンする</button>
      </div>
    </div>

    <div id="battle-wait-section" class="battle-wait-section" style="display: none;">
      <p class="scanned-card-label">対戦に参加するキャラクター</p>
      <img id="battle-wait-photo" class="battle-wait-photo" src="" alt="" style="display: none;" />
      <h2 id="battle-wait-name" class="battle-wait-name"></h2>
      <p id="battle-wait-status" class="battle-wait-status">対戦キューに参加しています…</p>
      <button id="battle-home-btn" class="secondary">ホームに戻る</button>
    </div>

    <div id="photo-capture-section" class="photo-capture-section" style="display: none;">
      <p class="scanned-card-label">カードID <span id="photo-card-id"></span></p>
      <p class="photo-instruction">キャラクターの実物を、なるべく無地の背景（机や紙など）の上に置いて撮影してください</p>

      <div class="photo-frame">
        <video id="photo-video" playsinline autoplay muted></video>
        <canvas id="cutout-preview-canvas" style="display: none;"></canvas>
      </div>
      <canvas id="photo-capture-canvas" style="display: none;"></canvas>

      <div class="name-input-buttons">
        <button id="capture-photo-btn">撮影する</button>
        <button id="retake-photo-btn" class="secondary" style="display: none;">撮り直す</button>
        <button id="use-photo-btn" style="display: none;">この写真を使う</button>
        <button id="skip-photo-btn" class="secondary">写真なしで進む</button>
      </div>
    </div>

    <div id="status-display-section" class="status-display-section" style="display: none;">
      <div class="reveal-stage">
        <div class="reveal-flash" id="reveal-flash"></div>
        <div class="shockwave-ring" id="shockwave-ring"></div>

        <div class="reveal-card" id="reveal-card">
          <div class="reveal-card-inner" id="reveal-card-inner">
            <div class="reveal-card-face reveal-card-back">
              <div class="crest-glyph">⬡</div>
              <p class="crest-caption">ORISAMO CARD</p>
            </div>

            <div class="reveal-card-face reveal-card-front">
              <img id="card-art" class="card-art" src="" alt="" />

              <img id="card-character-cutout" class="card-character-cutout" src="" alt="" style="display: none;" />

              <p id="mutation-badge" class="mutation-badge" style="display: none;">★ 突然変異 ★</p>

              <span id="defense-badge" class="overlay-defense">🛡 <span id="result-defense"></span></span>

              <h2 id="result-character-name" class="result-character-name"></h2>

              <span id="result-hp" class="overlay-value overlay-hp"></span>
              <span id="result-attack" class="overlay-value overlay-atk"></span>
              <span id="result-speed" class="overlay-value overlay-spd"></span>

              <div class="overlay-skill">
                <p id="result-skill-name" class="skill-name"></p>
                <p id="result-skill-description" class="skill-description"></p>
              </div>
            </div>
          </div>
        </div>

        <div class="flash-bulbs" id="flash-bulbs"></div>
        <div class="sparkle-layer" id="sparkle-layer"></div>
      </div>

      <div class="name-input-buttons reveal-actions">
        <button id="next-scan-btn">つぎのカードをスキャン</button>
        <button id="reveal-home-btn" class="secondary">ホームに戻る</button>
      </div>
    </div>

    <div id="status" class="status">読み込み中...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
