<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>オリサモ カードスキャン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Shippori+Antique+B1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css?v=0.5.0" />
</head>
<body>
  <div class="arena-backdrop"></div>
  <div class="mutation-vignette" id="mutation-vignette"></div>
  <div class="stage-spotlight"></div>
  <div class="stage-dust" id="stage-dust"></div>

  <!-- 登録済みのカードを読み取った時に、画面いっぱいに大きく出す警告 -->
  <div id="registered-overlay" class="registered-overlay" role="alertdialog" aria-labelledby="registered-title">
    <div class="registered-panel">
      <div class="registered-seal" aria-hidden="true"><span>済</span></div>
      <p id="registered-title" class="registered-title">既に<br />登録済みです</p>
      <img id="registered-photo" class="registered-photo" alt="" />
      <p class="registered-name-label">このカードのキャラクター</p>
      <p id="registered-name" class="registered-name"></p>
      <p class="registered-hint">別のカードを読み取ってください</p>
      <button id="registered-close-btn" class="registered-close-btn">OK</button>
    </div>
  </div>

  <div class="container">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"><span>召</span></div>
      <h1><span class="brand-logo">ORISAMO</span><span class="brand-sub">カードスキャン</span></h1>
    </header>

    <div id="home-section" class="home-section">
      <p class="home-lead">やりたいことを選んでください</p>
      <div class="home-buttons">
        <button id="create-character-btn" class="home-btn home-btn-create">
          <span class="home-btn-icon">召</span>
          <span class="home-btn-label">カードを登録</span>
        </button>
        <button id="start-battle-btn" class="home-btn home-btn-battle">
          <span class="home-btn-icon">戦</span>
          <span class="home-btn-label">対戦する</span>
        </button>
      </div>

      <!-- 開発者モード(URLに ?dev=1 を付けた時だけ表示)。QRコードを読み取らずに登録・対戦できる -->
      <div id="dev-panel" class="dev-panel" style="display: none;">
        <p class="dev-panel-title">開発者モード<span>QRコードなしで操作できます</span></p>
        <label class="dev-label" for="dev-card-id">カードID（空欄なら新しいテストカードを発行）</label>
        <input id="dev-card-id" class="dev-input" type="text" autocomplete="off" spellcheck="false" placeholder="例: dev-1a2b3c4d" />
        <div class="dev-buttons">
          <button id="dev-register-btn" class="dev-btn">このIDで登録</button>
          <button id="dev-battle-btn" class="dev-btn">このIDで対戦</button>
          <button id="dev-quick-battle-btn" class="dev-btn dev-btn-wide">テストキャラで今すぐ対戦</button>
          <button id="dev-cpu-btn" class="dev-btn dev-btn-wide dev-btn-cpu">CPU相手を呼ぶ（空いている枠に参加）</button>
        </div>
      </div>
    </div>

    <div id="reader" style="display: none;"></div>
    <button id="back-to-home-btn" class="back-to-home-btn" style="display: none;">← ホームに戻る</button>

    <div id="name-input-section" class="name-input-section" style="display: none;">
      <p class="scanned-card-label">カードID <span id="scanned-card-id"></span></p>
      <label for="character-name">キャラクターの名前</label>
      <input type="text" id="character-name" placeholder="なまえを入力" maxlength="20" />
      <div class="name-input-buttons">
        <button id="register-btn">登録する</button>
        <button id="rescan-btn" class="secondary">もう一度スキャンする</button>
      </div>
    </div>

    <div id="battle-wait-section" class="battle-wait-section" style="display: none;">
      <p class="scanned-card-label">対戦に参加するキャラクター</p>
      <img id="battle-wait-photo" class="battle-wait-photo" src="" alt="" style="display: none;" />
      <h2 id="battle-wait-name" class="battle-wait-name"></h2>
      <p id="battle-wait-status" class="battle-wait-status">対戦キューに参加しています…</p>
      <button id="battle-wait-cpu-btn" class="dev-btn dev-btn-wide dev-btn-cpu" style="display: none;">開発者: CPU相手を呼ぶ</button>
      <button id="battle-home-btn" class="secondary">ホームに戻る</button>
    </div>

    <div id="battle-turn-section" class="battle-wait-section" style="display: none;">
      <p id="battle-turn-prompt" class="battle-wait-status">対戦相手を確認しています…</p>
      <div id="battle-turn-buttons" class="battle-turn-buttons" style="display: none;">
        <button id="battle-turn-strong-btn" class="battle-turn-strong">強</button>
        <button id="battle-turn-normal-btn" class="battle-turn-normal">普</button>
        <button id="battle-turn-weak-btn" class="battle-turn-weak">弱</button>
      </div>
      <p id="battle-turn-result" class="battle-turn-result" style="display: none;"></p>
      <button id="battle-turn-home-btn" class="secondary" style="display: none;">ホームに戻る</button>
    </div>

    <div id="photo-capture-section" class="photo-capture-section" style="display: none;">
      <p class="scanned-card-label">カードID <span id="photo-card-id"></span></p>
      <p class="photo-instruction">画面のキャラクターをタップして選んでから撮影してください。AIがそのキャラクターだけを切り抜きます</p>

      <div id="photo-frame" class="photo-frame">
        <video id="photo-video" playsinline autoplay muted></video>
        <div id="photo-target" class="photo-target" aria-hidden="true"></div>
        <canvas id="cutout-preview-canvas" style="display: none;"></canvas>
      </div>
      <canvas id="photo-capture-canvas" style="display: none;"></canvas>

      <div class="name-input-buttons">
        <button id="capture-photo-btn">撮影する</button>
        <button id="retake-photo-btn" class="secondary" style="display: none;">撮り直す</button>
        <button id="use-photo-btn" style="display: none;">この写真を使う</button>
        <button id="skip-photo-btn" class="secondary">写真なしで進む</button>
      </div>
    </div>

    <div id="status-display-section" class="status-display-section" style="display: none;">
      <div class="reveal-stage">
        <div class="reveal-flash" id="reveal-flash"></div>
        <div class="shockwave-ring" id="shockwave-ring"></div>

        <div class="reveal-card" id="reveal-card">
          <div class="reveal-card-inner" id="reveal-card-inner">
            <div class="reveal-card-face reveal-card-back">
              <div class="crest-glyph"><span>召</span></div>
              <p class="crest-caption">ORISAMO CARD</p>
            </div>

            <div class="reveal-card-face reveal-card-front">
              <img id="card-art" class="card-art" src="" alt="" />

              <img id="card-character-cutout" class="card-character-cutout" src="" alt="" style="display: none;" />
              <!-- 写真の上に、カード画像のステータス欄と属性マークだけを重ね直す(写真で隠れないように) -->
              <img id="card-art-stats" class="card-art-layer card-art-stats" src="" alt="" />
              <img id="card-art-emblem" class="card-art-layer card-art-emblem" src="" alt="" />

              <p id="mutation-badge" class="mutation-badge" style="display: none;">★ 突然変異 ★</p>

              <span id="defense-badge" class="overlay-defense">🛡 <span id="result-defense"></span></span>

              <h2 id="result-character-name" class="result-character-name"></h2>

              <span id="result-hp" class="overlay-value overlay-hp"></span>
              <span id="result-attack" class="overlay-value overlay-atk"></span>
              <span id="result-speed" class="overlay-value overlay-spd"></span>

              <div class="overlay-skill">
                <p id="result-skill-name" class="skill-name"></p>
                <p id="result-skill-description" class="skill-description"></p>
              </div>
            </div>
          </div>
        </div>

        <div class="flash-bulbs" id="flash-bulbs"></div>
        <div class="sparkle-layer" id="sparkle-layer"></div>
      </div>

      <div class="name-input-buttons reveal-actions">
        <button id="next-scan-btn">つぎのカードをスキャン</button>
        <button id="reveal-home-btn" class="secondary">ホームに戻る</button>
      </div>
    </div>

    <div id="status" class="status">読み込み中...</div>
    <p id="app-version" class="app-version"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js?v=0.5.0"></script>
</body>
</html>
